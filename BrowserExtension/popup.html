<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FocusLock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>FocusLock V5</h1>
    <div id="status" class="pill">Đang kết nối...</div>
    <div class="row"><span>Trang</span><strong id="host">—</strong></div>
    <div class="row"><span>Phân loại</span><strong id="category">Neutral</strong></div>
    <div class="row"><span>Rule</span><strong id="rule">—</strong></div>
    <div class="row"><span>Giải trí còn</span><strong id="balance">00:00</strong></div>
    <p id="message"></p>
    <button id="refresh">Làm mới</button>
    <small>Quản lý rule chi tiết trong FocusLock → Trình duyệt V5.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
