<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FocusLock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="brand"><span class="logo">FL</span><div><h1>FocusLock</h1><span>Học trước · chơi sau</span></div></div>
      <div id="status" class="status">Đang kết nối…</div>
    </header>

    <section class="site-card">
      <div class="eyebrow">TRANG ĐANG MỞ</div>
      <strong id="host" class="host">—</strong>
      <div class="meta"><span id="category" class="category">Chưa phân loại</span><span id="rule" class="rule">—</span></div><div class="meta"><span id="profile" class="rule">Profile: —</span><span id="access" class="rule">—</span></div>
    </section>

    <section class="balance-card">
      <div><span class="eyebrow">THỜI GIAN GIẢI TRÍ</span><strong id="balance">00:00</strong></div>
      <span class="game">🎮</span>
    </section>

    <p id="message" class="message"></p>
    <button id="refresh">Làm mới trạng thái</button>
    <small>Quản lý website trong FocusLock → Website.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
