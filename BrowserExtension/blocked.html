<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FocusLock · Thời gian giải trí đã hết</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main>
    <div class="logo">FL</div>
    <div class="pill">🔒 ĐANG GIỚI HẠN GIẢI TRÍ</div>
    <h1>Hết thời gian giải trí</h1>
    <h2 id="host">—</h2>
    <p id="reason">Bạn chưa có thời gian giải trí khả dụng.</p>
    <section class="balance"><span>Thời gian còn lại</span><strong id="balance">00:00</strong></section>
    <div class="howto"><strong>Muốn mở lại?</strong><span>Quay về ứng dụng học/làm việc. Khi đủ một phiên Focus, bạn sẽ nhận phần thưởng để mở khóa.</span></div>
    <button id="retry">Tôi đã có thời gian · thử lại</button>
    <footer>FocusLock · Học trước, chơi sau.</footer>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
